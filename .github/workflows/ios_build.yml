name: Build iOS IPA

on:
  push:
    paths:
      - 'iOSApp/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          # Najnowszy Xcode 26+/27+ (np. 26.6 ma SDK; 26.0.1 bywa bez platformy iOS)
          XCODE=$(ls -d /Applications/Xcode_27*.app /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode.app 2>/dev/null | head -n 1)
          fi
          if [ -z "$XCODE" ]; then
            echo "Nie znaleziono Xcode 26+"
            ls /Applications/Xcode*.app || true
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone || true

      - name: Install dependencies (if any)
        run: |
          echo "No extra deps"

      - name: Build archive (unsigned / CODE_SIGNING_ALLOWED=NO)
        run: |
          xcodebuild -scheme StartPCApp -project iOSApp/StartPCApp.xcodeproj \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ${{ runner.temp }}/StartPCApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean archive

      - name: Package unsigned IPA for 3uTools
        run: |
          APP_PATH="${{ runner.temp }}/StartPCApp.xcarchive/Products/Applications/StartPCApp.app"
          IPA_DIR="${{ runner.temp }}/ipa"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/"
          cd "$IPA_DIR"
          zip -r StartPCApp.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StartPCApp-ipa
          path: ${{ runner.temp }}/ipa/StartPCApp.ipa
